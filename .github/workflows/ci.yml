name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight validation dependency
        run: python -m pip install openpyxl==3.1.2

      - name: Compile Python sources
        run: python -m compileall backend engine rag scoring training run_bactaid.py

      - name: Validate tracked runtime assets exist
        run: |
          python - <<'PY'
          from pathlib import Path

          required_paths = [
              Path("data/bacteria_db.xlsx"),
              Path("data/rag/index/kb_index.json"),
              Path("models/genus_xgb.json"),
              Path("models/genus_xgb_meta.json"),
              Path("backend/app.py"),
          ]

          missing = [str(path) for path in required_paths if not path.exists()]
          if missing:
              raise SystemExit(f"Missing required tracked assets: {missing}")

          print("Required tracked assets are present.")
          PY

      - name: Validate LFS-managed runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path

          # CI checks out without Git LFS objects, so these files may be valid
          # LFS pointer stubs instead of full runtime assets.
          lfs_files = [
              ("data/bacteria_db.xlsx", b"PK"),
              ("data/rag/index/kb_index.json", b"{"),
              ("models/genus_xgb.json", b"{"),
          ]

          def read_prefix(path: Path, size: int = 256) -> bytes:
              with path.open("rb") as handle:
                  return handle.read(size)

          def is_lfs_pointer(prefix: bytes) -> bool:
              return prefix.startswith(b"version https://git-lfs.github.com/spec/v1")

          for raw_path, expected_prefix in lfs_files:
              path = Path(raw_path)
              prefix = read_prefix(path)

              if is_lfs_pointer(prefix):
                  text = prefix.decode("utf-8", errors="replace")
                  if "oid sha256:" not in text or "size " not in text:
                      raise SystemExit(f"Malformed Git LFS pointer: {raw_path}")
                  print(f"{raw_path}: valid Git LFS pointer")
                  continue

              if not prefix.startswith(expected_prefix):
                  raise SystemExit(
                      f"{raw_path}: expected Git LFS pointer or real asset prefix {expected_prefix!r}"
                  )

              print(f"{raw_path}: real asset present")
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
