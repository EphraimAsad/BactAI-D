name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight validation dependency
        run: python -m pip install openpyxl==3.1.2

      - name: Compile Python sources
        run: python -m compileall backend engine rag scoring training run_bactaid.py

      - name: Validate tracked runtime assets exist
        run: |
          python - <<'PY'
          from pathlib import Path

          required_paths = [
              Path("data/bacteria_db.xlsx"),
              Path("data/rag/index/kb_index.json"),
              Path("models/genus_xgb.json"),
              Path("models/genus_xgb_meta.json"),
              Path("backend/app.py"),
          ]

          missing = [str(path) for path in required_paths if not path.exists()]
          if missing:
              raise SystemExit(f"Missing required tracked assets: {missing}")

          print("Required tracked assets are present.")
          PY

      - name: Validate database shape
        run: |
          python - <<'PY'
          from openpyxl import load_workbook

          wb = load_workbook("data/bacteria_db.xlsx", read_only=True)
          ws = wb[wb.sheetnames[0]]
          header = next(ws.iter_rows(values_only=True))

          if "Genus" not in header:
              raise SystemExit("Database header is missing the 'Genus' column.")

          print(f"Database sheet: {wb.sheetnames[0]}")
          print(f"Database columns: {len(header)}")
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
